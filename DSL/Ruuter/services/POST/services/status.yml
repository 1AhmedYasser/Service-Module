declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'STATUS'"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: id
        type: string
        description: "Body field 'id'"
      - field: state
        type: string
        description: "Body field 'state'"
      - field: type
        type: string
        description: "Body field 'type'"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"      

extract_request_data:
  assign:
    id: ${incoming.body.id}
    new_state: ${incoming.body.state}
    ruuter_type: ${incoming.body.type}

check_for_required_parameters:
  switch:
    - condition: ${id === null || new_state === null || ruuter_type === null}
      next: return_incorrect_request
    - condition: ${new_state === "ready"}
      next: set_plain_status
  next: get_current_status

get_current_status:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/status"
    body:
      id: ${id}
  result: status_res
  next: assign_old_status_and_path

assign_old_status_and_path:
  assign:
    old_file_status_path: "${status_res.response.body[0].currentState === 'ready' ? 'draft' : status_res.response.body[0].currentState}"
    old_file_end: "${status_res.response.body[0].currentState !== 'active' ? '.tmp' : '.yml'}"
  next: check_status

check_status:
  switch:
    - condition: ${new_state === "draft"}
      next: set_status
    - condition: ${status_res.response.body[0].currentState === new_state}
      next: return_same_state_update
  next: set_status

set_status:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/set-status"
    body:
      id: ${id}
      new_state: ${new_state}
  result: res
  next: get_status_name

set_plain_status:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/set-status"
    body:
      id: ${id}
      new_state: ${new_state}
  result: draft_res
  next: return_ok

get_status_name:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/get-service-name-by-id"
    body:
      id: ${id}
  result: name_res
  next: assign_values

assign_values:
  assign:
    name: ${name_res.response.body[0].name}
    service_name: "service_${name_res.response.body[0].name}"
    storage_file_name: ${'service_' + id + '_' + name_res.response.body[0].name.replace(/[^a-zA-Z0-9._-]/g, '_')}
  next: check_file_exists

check_file_exists:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/exists"
    body:
      file_path: "[#RUUTER_SERVICES_POST_PATH]/${old_file_status_path}/${name + old_file_end}"
  result: service_file_exists_result
  next: validate_file_exists

validate_file_exists:
  switch:
    - condition: ${!!service_file_exists_result.response.body}
      next: check_for_status
  next: return_service_file_missing

check_for_status:
  switch:
    - condition: ${new_state === "active"}
      next: activate_service
    - condition: ${new_state === "draft"}
      next: check_remove_blob_before_draft
  next: deactivate_service

check_remove_blob_before_draft:
  switch:
    - condition: ${status_res.response.body[0].currentState === 'active' && [#AZURE_STORAGE_ENABLED] === true}
      next: delete_from_storage_before_draft
  next: draft_service

delete_from_storage_before_draft:
  call: http.delete
  args:
    url: "[#STORAGE_FERRY]/v1/files/delete"
    body:
      files:
        - storageAccountId: "[#STORAGE_FERRY_ACCOUNT_ID]"
          container: "[#STORAGE_FERRY_CONTAINER]"
          fileName: "${storage_file_name}.json"
  result: ferry_delete_result
  error: check_delete_from_storage_before_draft
  next: check_delete_from_storage_before_draft

check_delete_from_storage_before_draft:
  switch:
    - condition: ${200 <= ferry_delete_result.response.statusCodeValue && ferry_delete_result.response.statusCodeValue < 300}
      next: trigger_azure_indexer_before_draft
    - condition: ${ferry_delete_result.response.statusCodeValue === 404}
      next: draft_service
  next: restore_status_after_storage_failure

restore_status_after_storage_failure:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/set-status"
    body:
      id: ${id}
      new_state: ${status_res.response.body[0].currentState}
  result: restore_status_res
  next: return_storage_delete_failed

trigger_azure_indexer_before_draft:
  template: "[#SERVICE_PROJECT_LAYER]/trigger-azure-indexer"
  requestType: templates
  result: azure_indexer_result
  next: draft_service

activate_service:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/move"
    body:
      file_path: "[#RUUTER_SERVICES_POST_PATH]/${old_file_status_path}/${name + old_file_end}"
      new_path: "[#RUUTER_SERVICES_POST_PATH]/active/${name}.yml"
  result: activate_service_result
  next: get_service_data_for_json

get_service_data_for_json:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/get-service-by-id"
    body:
      id: ${id}
  result: service_data_result
  next: generate_service_json

generate_service_json:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER_HBS]/service_declaration"
    headers:
      type: 'json'
    body:
      name: ${name}
      description: ${service_data_result.response.body[0].description}
      examples: ${service_data_result.response.body[0].examples}
      entities: ${service_data_result.response.body[0].entities}
  result: service_json_result
  next: check_if_azure_storage_is_enabled

check_if_azure_storage_is_enabled:
  switch:
    - condition: ${[#AZURE_STORAGE_ENABLED] === true && service_data_result.response.body[0].discoverable === true}
      next: create_in_storage
  next: activate_all_mcq_services  

create_in_storage:
  call: http.post
  args:
    url: "[#STORAGE_FERRY]/v1/files/create"
    body:
      files:
        - storageAccountId: "[#STORAGE_FERRY_ACCOUNT_ID]"
          container: "[#STORAGE_FERRY_CONTAINER]"
          fileName: "${storage_file_name}.json"
      content: ${JSON.stringify(service_json_result.response.body)}
  result: ferry_upload_result
  next: trigger_azure_indexer_after_create

trigger_azure_indexer_after_create:
  template: "[#SERVICE_PROJECT_LAYER]/trigger-azure-indexer"
  requestType: templates
  result: azure_indexer_result
  next: activate_all_mcq_services
 
activate_all_mcq_services:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/move-all-that-starts-with"
    body:
      file_path: "[#RUUTER_SERVICES_POST_PATH]/${old_file_status_path}"
      new_path: "[#RUUTER_SERVICES_POST_PATH]/active"
      keyword: "${name}_mcq_"
      format: "yml"
  result: active_move_results
  next: check_if_discoverable

check_if_discoverable:
  switch:
    - condition: ${service_data_result.response.body[0].discoverable === true}
      next: call_llm_index
  next: return_ok

call_llm_index:
  call: http.post
  args:
    url: "[#SERVICE_RUUTER]/services/service-index-llm"
    headers:
      cookie: ${incoming.headers.cookie}
    body:
      serviceId: ${id}
      name: ${name}
      description: ${service_data_result.response.body[0].description}
      examples: ${service_data_result.response.body[0].examples}
      entities: ${service_data_result.response.body[0].entities}
      type: ${ruuter_type}
      state: ${new_state}
  result: llm_enrich_result
  error: llm_enrich_error
  next: return_ok

llm_enrich_error:
  log: "Error occurred while calling LLM enrich service for service id: ${id}"
  next: return_ok

deactivate_service:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/move"
    body:
      file_path: "[#RUUTER_SERVICES_POST_PATH]/${old_file_status_path}/${name + old_file_end}"
      new_path: "[#RUUTER_SERVICES_POST_PATH]/inactive/${name}.tmp"
  result: deactivate_service_result
  next: check_if_azure_storage_is_enabled_before_delete

check_if_azure_storage_is_enabled_before_delete:
  switch:
    - condition: ${[#AZURE_STORAGE_ENABLED] === true}
      next: delete_from_storage
  next: dactivate_all_mcq_services

delete_from_storage:
  call: http.delete
  args:
    url: "[#STORAGE_FERRY]/v1/files/delete"
    body:
      files:
        - storageAccountId: "[#STORAGE_FERRY_ACCOUNT_ID]"
          container: "[#STORAGE_FERRY_CONTAINER]"
          fileName: "${storage_file_name}.json"
  result: ferry_delete_result
  next: trigger_azure_indexer_after_delete

trigger_azure_indexer_after_delete:
  template: "[#SERVICE_PROJECT_LAYER]/trigger-azure-indexer"
  requestType: templates
  result: azure_indexer_result
  next: dactivate_all_mcq_services

dactivate_all_mcq_services:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/move-all-that-starts-with"
    body:
      file_path: "[#RUUTER_SERVICES_POST_PATH]/${old_file_status_path}"
      new_path: "[#RUUTER_SERVICES_POST_PATH]/inactive"
      keyword: "${name}_mcq_"
      format: "tmp"
  result: inactive_move_results
  next: return_ok

draft_service:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/move"
    body:
      file_path: "[#RUUTER_SERVICES_POST_PATH]/${old_file_status_path}/${name + old_file_end}"
      new_path: "[#RUUTER_SERVICES_POST_PATH]/draft/${name}.tmp"
  result: draft_service_result
  next: draft_all_mcq_services

draft_all_mcq_services:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/move-all-that-starts-with"
    body:
      file_path: "[#RUUTER_SERVICES_POST_PATH]/${old_file_status_path}"
      new_path: "[#RUUTER_SERVICES_POST_PATH]/draft"
      keyword: "${name}_mcq_"
      format: "tmp"
  result: inactive_move_results
  next: return_ok

return_ok:
  reloadDsl: true
  status: 200
  return: "Status Changed Successfully"
  next: end

return_bad_request:
  status: 400
  return: ${err_result.response.body.message}
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameter(s) missing"
  next: end

return_same_state_update:
  status: 200
  return: "Service is already in this state"
  next: end

return_service_file_missing:
  status: 500
  return: "Service file to update is missing"
  next: end

return_storage_delete_failed:
  status: 500
  return: "Failed to delete service from storage"
  next: end

return_intent_does_not_exist:
  status: 400
  return: "does not exists"
  next: end
